name: .NET Core Build and Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET 10 LTS
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore MahmoudAI.sln

    - name: Build Solution
      run: dotnet build MahmoudAI.sln --configuration Release --no-restore

    - name: Run Tests
      run: dotnet test MahmoudAI.sln --configuration Release --no-build --verbosity normal
