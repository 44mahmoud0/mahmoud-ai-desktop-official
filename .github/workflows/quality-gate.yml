name: MahmoudAI Quality Gate & CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Preflight Solution and Project Assertion
      shell: pwsh
      run: |
        if (!(Test-Path "MahmoudAI.sln")) {
          Write-Error "CRITICAL: MahmoudAI.sln not found!"
          exit 1
        }
        $projects = [string[]](dotnet sln MahmoudAI.sln list)
        Write-Host "Projects in solution:"
        $projects | ForEach-Object { Write-Host " - $_" }

        $requiredProjects = @("MahmoudAI.Core", "MahmoudAI.WindowsIntegration", "MahmoudAI.Storage", "MahmoudAI.Security", "MahmoudAI.Mcp", "MahmoudAI.App", "MahmoudAI.Core.Tests")
        foreach ($req in $requiredProjects) {
          $found = $false
          foreach ($p in $projects) {
            if ($p -match $req) {
              $found = $true
              break
            }
          }
          if (-not $found) {
            Write-Error "CRITICAL: Required project '$req' is missing from MahmoudAI.sln!"
            exit 1
          }
        }
        Write-Host "All critical project preflight assertions passed successfully."

    - name: Restore Dependencies
      run: dotnet restore MahmoudAI.sln

    - name: Build Solution (Release)
      run: dotnet build MahmoudAI.sln --configuration Release --no-restore

    - name: Run Test Suite (Release)
      run: dotnet test MahmoudAI.sln --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test_results.trx"

    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-trx
        path: '**/*.trx'
