name: MahmoudAI Quality Gate & CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Preflight Solution and Project Assertion
      shell: pwsh
      run: |
        if (!(Test-Path "MahmoudAI.sln")) {
          Write-Error "CRITICAL: MahmoudAI.sln not found!"
          exit 1
        }
        $projects = dotnet sln MahmoudAI.sln list
        Write-Host $projects
        if ($projects -notmatch "MahmoudAI.Core") {
          Write-Error "CRITICAL: MahmoudAI.Core missing from solution!"
          exit 1
        }
        Write-Host "Preflight assertions passed successfully."

    - name: Restore Dependencies
      run: dotnet restore MahmoudAI.sln

    - name: Build Solution (Release)
      run: dotnet build MahmoudAI.sln --configuration Release --no-restore

    - name: Run Test Suite (Release)
      run: dotnet test MahmoudAI.sln --configuration Release --no-build --verbosity normal
