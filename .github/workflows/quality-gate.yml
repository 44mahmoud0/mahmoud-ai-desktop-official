name: MahmoudAI Quality Gate & CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Print Identity and Context Proof
      shell: pwsh
      run: |
        Write-Host "========================================="
        Write-Host "MAHMOUD AI CI IDENTITY & CONTEXT PROOF"
        Write-Host "========================================="
        Write-Host "Event Name: ${{ github.event_name }}"
        Write-Host "GitHub Ref: ${{ github.ref }}"
        Write-Host "GitHub SHA: ${{ github.sha }}"
        Write-Host "PR Head SHA: ${{ github.event.pull_request.head.sha }}"
        Write-Host "PR Base SHA: ${{ github.event.pull_request.base.sha }}"
        Write-Host "Repository: ${{ github.repository }}"
        Write-Host "========================================="

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Preflight Solution and Project Assertion (Anti-False-Green V4)
      shell: pwsh
      run: |
        if (!(Test-Path "MahmoudAI.sln")) {
          Write-Error "CRITICAL: MahmoudAI.sln not found!"
          exit 1
        }
        $slnOutput = dotnet sln MahmoudAI.sln list
        $projects = @()
        foreach ($line in $slnOutput) {
          $trimmed = $line.Trim().Trim("`r", "`n")
          if ($trimmed -and $trimmed -notmatch "^Project\(s\)" -and $trimmed -notmatch "^---") {
            $projects += $trimmed
          }
        }
        Write-Host "Strictly parsed projects in solution ($($projects.Count)):"
        $projects | ForEach-Object { Write-Host " - '$_'" }

        $expectedProjects = @(
          "src\MahmoudAI.App\MahmoudAI.App.csproj",
          "src\MahmoudAI.Core\MahmoudAI.Core.csproj",
          "src\MahmoudAI.Mcp\MahmoudAI.Mcp.csproj",
          "src\MahmoudAI.Security\MahmoudAI.Security.csproj",
          "src\MahmoudAI.Storage\MahmoudAI.Storage.csproj",
          "src\MahmoudAI.WindowsIntegration\MahmoudAI.WindowsIntegration.csproj",
          "tests\MahmoudAI.Core.Tests\MahmoudAI.Core.Tests.csproj",
          "tests\MahmoudAI.WindowsIntegration.Tests\MahmoudAI.WindowsIntegration.Tests.csproj",
          "tests\MahmoudAI.WindowsIntegration.TestHost\MahmoudAI.WindowsIntegration.TestHost.csproj"
        )

        if ($projects.Count -ne $expectedProjects.Count) {
          Write-Error "CRITICAL: Expected exactly $($expectedProjects.Count) projects, but found $($projects.Count)!"
          exit 1
        }

        foreach ($exp in $expectedProjects) {
          $normExp = $exp.Replace('\', '/').ToLower()
          $found = $false
          foreach ($p in $projects) {
            $normP = $p.Replace('\', '/').ToLower()
            if ($normP -like "*$normExp*") {
              $found = $true
              break
            }
          }
          if (-not $found) {
            Write-Error "CRITICAL: Required project '$exp' is missing from solution parse!"
            exit 1
          }
        }
        Write-Host "Exact 9-project strict solution preflight passed successfully."

    - name: Restore Dependencies
      run: dotnet restore MahmoudAI.sln /p:MahmoudAIUnpackagedCiBuild=true /p:ContinuousIntegrationBuild=true

    - name: Build Solution (Release)
      run: dotnet build MahmoudAI.sln --configuration Release --no-restore /p:MahmoudAIUnpackagedCiBuild=true /p:ContinuousIntegrationBuild=true

    - name: Run Test Suite (Release)
      run: dotnet test MahmoudAI.sln --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test_results.trx" /p:MahmoudAIUnpackagedCiBuild=true

    - name: Verify Test Results (Strict V1.2.2 Behavioral Closure Gate)
      shell: pwsh
      run: |
        $trxFiles = Get-ChildItem -Recurse -Filter "*.trx"
        if ($trxFiles.Count -eq 0) {
          Write-Error "CRITICAL: No TRX test result files were generated!"
          exit 1
        }
        
        $corePassed = 0
        $coreTotal = 0
        $windowsPassed = 0
        $windowsTotal = 0
        $allTestResults = @{}

        foreach ($file in $trxFiles) {
          [xml]$xml = Get-Content $file.FullName
          $ns = New-Object System.Xml.XmlNamespaceManager($xml.NameTable)
          $ns.AddNamespace("t", "http://microsoft.com/schemas/VisualStudio/TeamTest/2010")
          
          $content = Get-Content $file.FullName -Raw
          $isCoreTest = $content -match "MahmoudAI\.Core\.Tests"
          $isWindowsTest = $content -match "MahmoudAI\.WindowsIntegration\.Tests"

          $results = $xml.SelectNodes("//t:UnitTestResult", $ns)
          foreach ($res in $results) {
            $name = [string]$res.testName
            $outcome = [string]$res.outcome
            $allTestResults[$name] = $outcome
          }

          $counters = $xml.SelectNodes("//t:Counters", $ns)
          foreach ($c in $counters) {
            if ($isCoreTest) {
              $coreTotal += [int]$c.total
              $corePassed += [int]$c.passed
            } elseif ($isWindowsTest) {
              $windowsTotal += [int]$c.total
              $windowsPassed += [int]$c.passed
            }
          }
        }

        Write-Host "Summary Breakdown:"
        Write-Host " - Core Tests: $corePassed / $coreTotal (Required >= 71)"
        Write-Host " - WindowsIntegration Tests: $windowsPassed / $windowsTotal (Required >= 10)"
        
        if ($coreTotal -lt 71) { Write-Error "CRITICAL: Core baseline failed ($coreTotal < 71)"; exit 1 }
        if ($windowsTotal -lt 10) { Write-Error "CRITICAL: WindowsIntegration baseline failed ($windowsTotal < 10)"; exit 1 }
        if ($corePassed -ne $coreTotal) { Write-Error "CRITICAL: Core tests failed"; exit 1 }
        if ($windowsPassed -ne $windowsTotal) { Write-Error "CRITICAL: WindowsIntegration tests failed"; exit 1 }

        $requiredWindowsTests = @(
          "CaptureAsync_RealTestHost_ReturnsRealPixels",
          "CaptureAsync_ValidTarget_InvalidRegion_IsRejected",
          "CaptureAsync_RealHwndWrongPid_ReturnsProcessMismatch",
          "CaptureAsync_ClosedTarget_DoesNotCapture",
          "CaptureAsync_RepeatedRealCaptures_AllComplete"
        )

        foreach ($req in $requiredWindowsTests) {
          $found = $false
          foreach ($name in $allTestResults.Keys) {
            if ($name -like "*$req*") {
              if ($allTestResults[$name] -eq "Passed") {
                $found = $true
                Write-Host "Mandatory Test Verified: $name => Passed"
                break
              }
            }
          }
          if (-not $found) {
            Write-Error "CRITICAL: Mandatory behavioral test missing or failed: $req"
            exit 1
          }
        }
        Write-Host "V1.2.2 Behavioral Closure Verification PASSED."

    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-trx
        path: '**/*.trx'
        if-no-files-found: error
